<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Two English Garden 🇬🇧</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f4f7f9;
      margin: 0; padding: 0;
    }

    /* ===== ヘッダー ===== */
    .header {
      background-color: #1a2a6c;
      color: white;
      padding: 32px 20px;
      text-align: center;
    }
    .header h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.2rem); }
    .header p  { margin: 8px 0 0; opacity: 0.85; font-size: 0.9rem; }

    /* ===== ログイン画面（モーダル） ===== */
    #login-screen {
      position: fixed; inset: 0;
      background: rgba(20, 30, 80, 0.92);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .login-box {
      background: white;
      border-radius: 16px;
      padding: 36px 32px;
      width: min(360px, 90vw);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-box h2 { margin: 0 0 6px; color: #1a2a6c; font-size: 1.3rem; }
    .login-box p  { margin: 0 0 24px; color: #666; font-size: 0.88rem; }
    .login-box input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #dde3ef;
      border-radius: 10px;
      font-size: 1.1rem;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-box input[type="password"]:focus { border-color: #1a2a6c; }
    .login-box .btn-login {
      margin-top: 16px;
      width: 100%;
      padding: 13px;
      background: #1a2a6c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-box .btn-login:hover { background: #253a96; }
    .login-box .btn-login:disabled { background: #aaa; cursor: not-allowed; }
    .error-msg {
      margin-top: 12px;
      color: #c0392b;
      font-size: 0.85rem;
      min-height: 20px;
    }
    .tries-msg {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
    }

    /* ===== タブ ===== */
    .tab-container {
      background: white;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab {
      padding: 14px 28px;
      cursor: pointer;
      color: #555;
      font-weight: bold;
      font-size: 0.95rem;
      border-bottom: 4px solid transparent;
      transition: 0.2s;
      white-space: nowrap;
    }
    .tab.active { color: #1a2a6c; border-bottom-color: #1a2a6c; }
    .tab:hover  { background-color: #f5f7ff; }

    /* ===== 検索バー ===== */
    .search-bar {
      max-width: 1100px;
      margin: 28px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-bar input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 2px solid #dde3ef;
      border-radius: 30px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: #1a2a6c; }
    .sort-select {
      padding: 10px 14px;
      border: 2px solid #dde3ef;
      border-radius: 30px;
      font-size: 0.9rem;
      background: white;
      cursor: pointer;
      outline: none;
    }
    .result-count {
      font-size: 0.85rem;
      color: #888;
      white-space: nowrap;
    }

    /* ===== カードグリッド ===== */
    .container { max-width: 1100px; margin: 20px auto 60px; padding: 0 20px; }
    .grid      { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }

    /* ===== カード ===== */
    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
      transition: transform 0.2s, box-shadow 0.2s;
      border-left: 6px solid #007bff;
    }
    .card.web-type { border-left-color: #e67e22; }
    .card:hover    { transform: translateY(-5px); box-shadow: 0 12px 28px rgba(0,0,0,0.12); }
    .card-content  { padding: 20px 22px; }
    .card-type-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 8px;
      background: #e8f0fe;
      color: #1a2a6c;
    }
    .card.web-type .card-type-badge { background: #fde8d8; color: #9a4500; }
    .card-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #1a1a2e;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .card-meta { font-size: 0.8rem; color: #999; margin-bottom: 16px; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      transition: opacity 0.2s, transform 0.1s;
      background: #007bff;
      color: white;
    }
    .card.web-type .btn { background: #e67e22; }
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    /* ===== スケルトン（ローディング） ===== */
    .skeleton-card {
      background: white;
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
    }
    .skeleton-line {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ===== 空・エラー表示 ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p     { margin: 6px 0; font-size: 0.95rem; }
    .retry-btn {
      margin-top: 16px;
      padding: 10px 24px;
      background: #1a2a6c;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<!-- ===== ログインモーダル ===== -->
<div id="login-screen">
  <div class="login-box">
    <h2>🇬🇧 For Two English Garden</h2>
    <p>教材アーカイブ</p>
    <input type="password" id="pw-input" placeholder="パスワード" maxlength="20"
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn-login" onclick="doLogin()" id="login-btn">ログイン</button>
    <div class="error-msg" id="error-msg"></div>
    <div class="tries-msg" id="tries-msg">残り 4 回</div>
  </div>
</div>

<!-- ===== ヘッダー ===== -->
<div class="header">
  <h1>For Two English Garden 🇬🇧</h1>
  <p>教材アーカイブ</p>
</div>

<!-- ===== タブ ===== -->
<div class="tab-container" id="tab-menu"></div>

<!-- ===== 検索バー ===== -->
<div class="search-bar">
  <input type="search" id="search-input" placeholder="🔍 教材を検索..." oninput="applyFilter()">
  <select class="sort-select" id="sort-select" onchange="applyFilter()">
    <option value="name">名前順</option>
    <option value="date">新着順</option>
    <option value="type">種類順</option>
  </select>
  <span class="result-count" id="result-count"></span>
</div>

<!-- ===== 教材一覧 ===== -->
<div class="container">
  <div id="material-list" class="grid"></div>
</div>

<script>
  // ===== 状態管理 =====
  var state = {
    categories: [],
    currentCategory: '',
    allData: [],
    triesLeft: 4
  };

  // ===== ログイン処理 =====
  function doLogin() {
    var pw  = document.getElementById('pw-input').value;
    var btn = document.getElementById('login-btn');
    var errMsg = document.getElementById('error-msg');

    if (!pw) {
      errMsg.textContent = 'パスワードを入力してください';
      return;
    }

    btn.disabled = true;
    btn.textContent = '確認中...';
    errMsg.textContent = '';

    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.textContent = 'ログイン';

        if (result.success) {
          state.categories      = result.categories;
          state.currentCategory = result.currentCategory;
          document.getElementById('login-screen').style.display = 'none';
          buildTabs();
          loadMaterials(state.currentCategory);
        } else {
          state.triesLeft--;
          document.getElementById('tries-msg').textContent =
            state.triesLeft > 0 ? ('残り ' + state.triesLeft + ' 回') : '';
          errMsg.textContent = result.error || '認証エラーが発生しました';
          document.getElementById('pw-input').value = '';
          document.getElementById('pw-input').focus();

          if (state.triesLeft <= 0) {
            document.getElementById('login-screen').innerHTML =
              '<div style="color:white;font-size:1.2rem;text-align:center;padding:40px">' +
              '⛔ アクセスがロックされました。<br>ページを更新してやり直してください。</div>';
          }
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'ログイン';
        document.getElementById('error-msg').textContent = '通信エラーが発生しました。もう一度お試しください。';
        console.error(err);
      })
      .verifyPassword(pw);
  }

  // ===== タブ構築 =====
  function buildTabs() {
    var menu = document.getElementById('tab-menu');
    menu.innerHTML = '';
    state.categories.forEach(function(cat) {
      var div = document.createElement('div');
      div.className = 'tab' + (cat === state.currentCategory ? ' active' : '');
      div.textContent = cat;
      div.onclick = function() { switchTab(cat); };
      menu.appendChild(div);
    });
  }

  function switchTab(cat) {
    state.currentCategory = cat;
    document.querySelectorAll('.tab').forEach(function(t) {
      t.classList.toggle('active', t.textContent === cat);
    });
    document.getElementById('search-input').value = '';
    loadMaterials(cat);
  }

  // ===== 教材読み込み =====
  function loadMaterials(category) {
    showSkeletons();
    google.script.run
      .withSuccessHandler(function(data) {
        state.allData = data;
        applyFilter();
      })
      .withFailureHandler(function(err) {
        showError('教材の読み込みに失敗しました。');
        console.error(err);
      })
      .getMaterials(category);
  }

  // ===== フィルター・ソート =====
  function applyFilter() {
    var keyword = document.getElementById('search-input').value.toLowerCase();
    var sortKey = document.getElementById('sort-select').value;

    var filtered = state.allData.filter(function(d) {
      return d.name.toLowerCase().includes(keyword);
    });

    if (sortKey === 'date') {
      filtered.sort(function(a, b) { return (b.updated || '').localeCompare(a.updated || ''); });
    } else if (sortKey === 'type') {
      filtered.sort(function(a, b) { return a.isWeb === b.isWeb ? 0 : a.isWeb ? 1 : -1; });
    } else {
      filtered.sort(function(a, b) { return a.name.localeCompare(b.name, 'ja'); });
    }

    document.getElementById('result-count').textContent =
      keyword ? (filtered.length + ' 件') : ('全 ' + filtered.length + ' 件');
    render(filtered);
  }

  // ===== カード描画 =====
  function render(items) {
    var list = document.getElementById('material-list');
    list.innerHTML = '';

    if (items.length === 0) {
      list.innerHTML =
        '<div class="empty-state">' +
        '<div class="icon">📭</div>' +
        '<p>教材が見つかりませんでした</p>' +
        '<p>検索ワードを変えてお試しください</p>' +
        '</div>';
      return;
    }

    items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = item.isWeb ? 'card web-type' : 'card';
      div.innerHTML =
        '<div class="card-content">' +
        '<div class="card-type-badge">' + (item.isWeb ? '🔗 Web教材' : '📄 PDF') + '</div>' +
        '<div class="card-title">'      + escapeHtml(item.name)    + '</div>' +
        '<div class="card-meta">更新: ' + escapeHtml(item.updated) + '</div>' +
        '<a href="'  + escapeHtml(item.url) + '" target="_blank" rel="noopener" class="btn">' +
        (item.isWeb ? 'サイトを開く' : 'PDFを開く') +
        '</a></div>';
      list.appendChild(div);
    });
  }

  // ===== スケルトン =====
  function showSkeletons() {
    var list = document.getElementById('material-list');
    var html = '';
    for (var i = 0; i < 6; i++) {
      html +=
        '<div class="skeleton-card">' +
        '<div class="skeleton-line" style="height:14px;width:50%;margin-bottom:12px"></div>' +
        '<div class="skeleton-line" style="height:18px;width:80%;margin-bottom:8px"></div>'  +
        '<div class="skeleton-line" style="height:12px;width:35%;margin-bottom:20px"></div>' +
        '<div class="skeleton-line" style="height:38px;width:100%"></div>' +
        '</div>';
    }
    list.innerHTML = html;
  }

  // ===== エラー表示 =====
  function showError(msg) {
    var list = document.getElementById('material-list');
    list.innerHTML =
      '<div class="empty-state">' +
      '<div class="icon">⚠️</div>' +
      '<p>' + msg + '</p>' +
      '<button class="retry-btn" onclick="loadMaterials(state.currentCategory)">再読み込み</button>' +
      '</div>';
  }

  // ===== XSS対策 =====
  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g,  '&amp;')
      .replace(/</g,  '&lt;')
      .replace(/>/g,  '&gt;')
      .replace(/"/g,  '&quot;');
  }
</script>
</body>
</html>
